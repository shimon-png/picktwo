name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: picktwo
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/picktwo
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/picktwo
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CRON_SECRET: ci
      DEV_LOGIN: "true"
      # Every e2e user signs in from the same IP; relax rate limits for the test run only.
      E2E_RELAX_RATE_LIMITS: "true"
      # Pickbot answers come from a canned fake (no Claude API key in CI).
      PICKBOT_FAKE_AI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # No X pixel in tests: no third-party script, no fake sign-up conversions in the ad account.
      NEXT_PUBLIC_X_PIXEL_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run db:seed
      - run: npx playwright install --with-deps chromium
      - run: npm start & npx wait-on http://localhost:3000 && npm run test:e2e
